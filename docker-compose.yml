version: '3.8'

services:
  # ============================================================================
  # GATEWAY - FastAPI Application
  # ============================================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: llmflow-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      # Pass through all env vars from .env file
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - postgres
      - ollama
    networks:
      - llmflow-network
    restart: unless-stopped
    # Mount code for development (hot reload)
    volumes:
      - ./gateway:/app

  # ============================================================================
  # OLLAMA - Local LLM Runtime
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: llmflow-ollama
    ports:
      - "11434:11434"
    networks:
      - llmflow-network
    restart: unless-stopped
    # GPU support (optional - comment out if no GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      # Persist downloaded models
      - ollama-data:/root/.ollama

  # ============================================================================
  # REDIS - Caching Layer
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: llmflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - llmflow-network
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ============================================================================
  # POSTGRESQL - Query Logs & Analytics
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: llmflow-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-llmflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-llmflow_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-llmflow}
    networks:
      - llmflow-network
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: llmflow-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - llmflow-network
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # ============================================================================
  # GRAFANA - Visualization & Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: llmflow-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - llmflow-network
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  llmflow-network:
    driver: bridge

# ============================================================================
# VOLUMES - Persist data across container restarts
# ============================================================================
volumes:
  ollama-data: # Ollama models (~4GB per model)
  redis-data: # Cache data
  postgres-data: # Query logs
  prometheus-data: # Metrics time-series
  grafana-data: # Dashboards & settings
